name: Palace reference

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  palace:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - run: bun install
      - run: python -m pip install -r lib/palace/python/requirements.txt
      - run: bun run generate:palace work/palace
        env:
          PALACE_PROCESSES: 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: palace-reference-raw-fields
          path: work/palace
          retention-days: 30
      - run: bun scripts/palace/check-live-results.tsx work/palace
      - run: bun run test
