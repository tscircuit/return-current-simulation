name: Publish to npm
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
      - run: bun install
      - run: bun run build
      - run: bun test
      - run: bun run smoke:package
      # First publish needs NPM_TOKEN. Later releases can use npm trusted publishing
      # configured for this repository and publish-npm.yml (OIDC).
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
