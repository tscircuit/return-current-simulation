name: SI Transient Check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  si-transient-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libglu1-mesa ngspice
      - run: pip install gmsh==4.13.1 shapely==2.1.2 numpy==2.3.5 scipy==1.16.2 matplotlib==3.10.6
      - run: bun install
      - name: Check native SI diagnostics and open/closed eye analysis
        run: python -m unittest discover -s tests/python -p 'test_*.py' -v
      - run: bun test tests/si.test.tsx
        env:
          PALACE_MESH_PYTHON: python
          SI_PYTHON: python
          MPLCONFIGDIR: work/matplotlib
